{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ConnectHub</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back 👋</h1>

            <p class="subtitle">
                Login to continue to ConnectHub
            </p>

            {% if messages %}
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
            {% endif %}
            <br>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="bottom-text">
                Don't have an account?
                <a href="{% url 'signupView' %}">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</body>
</html>
